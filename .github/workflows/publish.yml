name: Publish to PyPI

on:
  push:
    branches:
      - main

jobs:
  publish:

    runs-on: ubuntu-latest

    concurrency:
      group: pseek-pypi-publish
      cancel-in-progress: false

    permissions:
      contents: read

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build packaging

      - name: Check package version
        id: check
        run: python scripts/check_version.py

      # Build the source distribution separately
      - name: Build source distribution
        if: steps.check.outputs.publish == 'true'
        run: python -m build --sdist

      # Build a PyPI-compatible Linux wheel in a manylinux container
      - name: Build Linux wheel
        if: steps.check.outputs.publish == 'true'
        uses: PyO3/maturin-action@v1
        with:
          command: build
          manylinux: "2_28"
          args: --release --out dist --compatibility pypi

      - name: Publish to PyPI
        if: steps.check.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
